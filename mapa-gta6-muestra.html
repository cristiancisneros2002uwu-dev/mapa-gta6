#map{flex:1;background:#1d3c6b}
.fab{position:absolute;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:1000;display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:99px;border:0;background:var(--a);color:#2A0A18;font:800 15px Figtree,sans-serif;box-shadow:0 10px 26px rgba(0,0,0,.45);cursor:pointer}
.fab b{background:#2A0A18;color:var(--a);border-radius:99px;padding:1px 8px;font-size:13px}
.note{position:absolute;left:12px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:999;max-width:52%;background:rgba(26,16,48,.86);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:12px;color:var(--mute)}
#panel{position:absolute;z-index:1001;right:0;top:0;bottom:0;width:340px;max-width:100%;background:var(--bg);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
#panel.open{transform:none}
#panel .ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
#panel .ph h2{margin:0;font:800 18px "Bricolage Grotesque",sans-serif}
#panel .ph button{background:none;border:0;color:var(--ink);font-size:26px;cursor:pointer}
#panel .all{display:flex;gap:8px;padding:10px 16px}
#panel .all button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 13px Figtree,sans-serif;cursor:pointer}
#cats{overflow:auto;padding:4px 10px 24px}
.cat{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:12px;cursor:pointer;user-select:none}
.cat:hover{background:var(--card)}
.cat .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:none;border:2px solid rgba(255,255,255,.85)}
.cat .lb{flex:1;font-weight:600}
.cat .ct{color:var(--mute);font-size:13px;min-width:28px;text-align:right}
.cat input{width:20px;height:20px;accent-color:var(--a)}
.cat.off .ic{filter:grayscale(1);opacity:.45}.cat.off .lb{color:var(--mute)}
@media (max-width:700px){#panel{top:auto;height:72vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%)}#panel.open{transform:none}header h1 small{display:none}header h1{font-size:16px}}
/* pins */
.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.marker-cluster div{background:var(--a)!important;color:#2A0A18;font:800 13px Figtree,sans-serif}
.marker-cluster{background:rgba(255,107,139,.35)!important}
/* labels */
.lbl{white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6)}
.lbl.big{font:800 20px "Bricolage Grotesque",sans-serif;letter-spacing:.18em;color:rgba(255,241,234,.55)}
.lbl.mid{font:700 13px Figtree,sans-serif;color:#fff}
.lbl.small{font:600 11px Figtree,sans-serif;color:#FFD9C2}
.lbl.water{font:italic 600 13px Figtree,sans-serif;color:#7FB2E5;letter-spacing:.06em}
.z-lo .lbl.small{display:none}.z-hi .lbl.big{opacity:.35}
/* popup */
.leaflet-popup-content-wrapper{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px}
.leaflet-popup-tip{background:var(--card)}
.leaflet-popup-content{margin:12px 14px;font:400 14px/1.45 Figtree,sans-serif;min-width:210px}
.pp-cat{display:inline-flex;gap:6px;align-items:center;font:700 11px Figtree,sans-serif;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;color:#1A1030}
.pp h3{margin:8px 0 4px;font:800 17px/1.2 "Bricolage Grotesque",sans-serif}
.pp .z{color:var(--b);font-weight:600;font-size:13px}
.pp p{margin:6px 0 0;color:#E9DCEF}
.pp a{display:inline-block;margin-top:8px;color:var(--b);font-weight:700;text-decoration:none}
.leaflet-container a.leaflet-popup-close-button{color:var(--mute)}
.leaflet-control-zoom a{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:rgba(26,16,48,.7)!important;color:var(--mute)!important}
.leaflet-control-attribution a{color:var(--b)!important}
</style>
</head>
<body>
<div id="app">
 <header>
  <a class="back" href="/" aria-label="Volver al inicio">‹</a>
  <h1>Mapa de GTA 6<small>Leonida completo</small></h1>
  <div class="search"><input id="q" type="search" placeholder="Buscar: Ammu-Nation, Dexter, NINE1NINE…" autocomplete="off" aria-label="Buscar en el mapa"/><div class="results" id="res"></div></div>
 </header>
 <div id="map"></div>
</div>
<div class="note" id="note">📍 Los pines marcan la zona de cada lugar.</div>
<button class="fab" id="fab">☰ Filtros <b id="fabc">0</b></button>
<aside id="panel" aria-label="Filtros">
 <div class="ph"><h2>¿Qué quieres ver?</h2><button id="close" aria-label="Cerrar">×</button></div>
 <div class="all"><button id="allon">Mostrar todo</button><button id="alloff">Ocultar todo</button></div>
 <div id="cats"></div>
</aside>

const cluster = L.markerClusterGroup({maxClusterRadius: 38, showCoverageOnHover: false, spiderfyOnMaxZoom: true, disableClusteringAtZoom: 4});
map.addLayer(cluster);
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[m]));
const markers = D.places.map(p => {
  const c = cats[p.c];
  const m = L.marker([p.lat, p.lng], {icon: L.divIcon({className: '', html: `<div class="pin" style="background:${c.col}">${c.e}</div>`, iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -14]}), title: p.n});
  m.bindPopup(`<div class="pp"><span class="pp-cat" style="background:${c.col}">${c.e} ${esc(c.n)}</span><h3>${esc(p.n)}</h3><div class="z">📍 ${esc(p.z)}</div>${p.d ? `<p>${esc(p.d)}</p>` : ''}<a href="${p.u}">Ver en la enciclopedia →</a></div>`, {maxWidth: 280});
  m._p = p; return m;
});
let on = new Set(D.cats.map(c => c.id));
function render() {
  cluster.clearLayers();
  const vis = markers.filter(m => on.has(m._p.c));
  cluster.addLayers(vis);
  document.getElementById('fabc').textContent = vis.length;
  document.querySelectorAll('.cat').forEach(el => { const id = el.dataset.id; el.classList.toggle('off', !on.has(id)); el.querySelector('input').checked = on.has(id); });
}
// filters panel
const counts = {}; D.places.forEach(p => counts[p.c] = (counts[p.c] || 0) + 1);
document.getElementById('cats').innerHTML = D.cats.filter(c => counts[c.id]).map(c => `<label class="cat" data-id="${c.id}"><span class="ic" style="background:${c.col}">${c.e}</span><span class="lb">${esc(c.n)}</span><span class="ct">${counts[c.id]}</span><input type="checkbox" checked/></label>`).join('');
document.querySelectorAll('.cat input').forEach(i => i.addEventListener('change', e => { const id = e.target.closest('.cat').dataset.id; e.target.checked ? on.add(id) : on.delete(id); render(); }));
document.getElementById('allon').onclick = () => { on = new Set(D.cats.map(c => c.id)); render(); };
document.getElementById('alloff').onclick = () => { on = new Set(); render(); };
const panel = document.getElementById('panel');
document.getElementById('fab').onclick = () => panel.classList.toggle('open');
document.getElementById('close').onclick = () => panel.classList.remove('open');
render();

// search
const q = document.getElementById('q'), res = document.getElementById('res');
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
q.addEventListener('input', () => {
  const t = norm(q.value.trim());
  if (t.length < 2) { res.style.display = 'none'; return; }
  const hits = markers.filter(m => norm(m._p.n + ' ' + m._p.z + ' ' + cats[m._p.c].n).includes(t)).slice(0, 30);
  res.innerHTML = hits.length ? hits.map((m, i) => `<button data-i="${markers.indexOf(m)}">${cats[m._p.c].e}<span>${esc(m._p.n)}<small>${esc(m._p.z)}</small></span></button>`).join('') : '<button disabled>Sin resultados</button>';
  res.style.display = 'block';
});
res.addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  const m = markers[+b.dataset.i]; on.add(m._p.c); render();
  res.style.display = 'none'; q.value = m._p.n; q.blur(); panel.classList.remove('open');
  cluster.zoomToShowLayer(m, () => m.openPopup());
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.style.display = 'none'; });
setTimeout(() => document.getElementById('note').style.display = 'none', 9000);
</script>
</body>
</html>
